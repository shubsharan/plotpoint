schema_version: "1.0"
workflow:
  id: "speckit"
  name: "Full SDD Cycle with Epic and ADR Governance"
  version: "2.0.0"
  author: "GitHub with Plotpoint workflow overlay"
  description: "Runs specify → review → plan → review → tasks → analyze → readiness review → implement"

requires:
  speckit_version: ">=0.8.8"
  integrations:
    any: ["codex"]

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  epic:
    type: string
    required: false
    prompt: "Optional parent epic path"
  integration:
    type: string
    default: "codex"
    prompt: "Integration to use"
  scope:
    type: string
    default: "full"
    enum: ["full", "backend-only", "frontend-only"]

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }} {{ inputs.epic }}"

  - id: review-spec
    type: gate
    message: "Review the generated spec, quality checklist, parent epic, and ADR references before planning."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    message: "Review the implementation plan, research, design artifacts, and architecture impact before generating tasks."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"

  - id: review-readiness
    type: gate
    message: "Review cross-artifact analysis and confirm every governing Major-impact ADR is Accepted before implementation."
    options: [approve, reject]
    on_reject: abort

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"
