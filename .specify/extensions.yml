installed:
  - git
  - workflow
settings:
  auto_execute_hooks: true
hooks:
  before_constitution:
    - extension: git
      command: speckit.git.initialize
      enabled: true
      optional: false
      prompt: Execute speckit.git.initialize?
      description: Initialize Git repository before constitution setup
      condition: null
  before_specify:
    - extension: git
      command: speckit.git.feature
      enabled: true
      optional: false
      prompt: Execute speckit.git.feature?
      description: Create feature branch before specification
      condition: null
  before_clarify:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit outstanding changes before clarification?
      description: Auto-commit before spec clarification
      condition: null
  before_plan:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit outstanding changes before planning?
      description: Auto-commit before implementation planning
      condition: null
  before_tasks:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit outstanding changes before task generation?
      description: Auto-commit before task generation
      condition: null
  before_implement:
    - extension: workflow
      command: speckit.workflow.check
      enabled: true
      optional: false
      prompt: Validate the feature workflow before implementation?
      description: Require valid epic and ADR references before implementation
      condition: null
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit outstanding changes before implementation?
      description: Auto-commit before implementation
      condition: null
  before_checklist:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit outstanding changes before checklist?
      description: Auto-commit before checklist generation
      condition: null
  before_analyze:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit outstanding changes before analysis?
      description: Auto-commit before analysis
      condition: null
  before_taskstoissues:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit outstanding changes before issue sync?
      description: Auto-commit before tasks-to-issues conversion
      condition: null
  after_constitution:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit constitution changes?
      description: Auto-commit after constitution update
      condition: null
  after_specify:
    - extension: workflow
      command: speckit.workflow.sync
      enabled: true
      optional: false
      prompt: Synchronize epic and feature documentation?
      description: Refresh the parent epic after feature creation
      condition: null
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit specification changes?
      description: Auto-commit after specification
      condition: null
  after_clarify:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit clarification changes?
      description: Auto-commit after spec clarification
      condition: null
  after_plan:
    - extension: workflow
      command: speckit.workflow.sync
      enabled: true
      optional: false
      prompt: Synchronize feature references?
      description: Refresh generated documentation after planning
      condition: null
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit plan changes?
      description: Auto-commit after implementation planning
      condition: null
  after_tasks:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit task changes?
      description: Auto-commit after task generation
      condition: null
  after_implement:
    - extension: workflow
      command: speckit.workflow.sync
      enabled: true
      optional: false
      prompt: Synchronize feature and epic status?
      description: Keep implementation status visible without marking the feature Done
      condition: null
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit implementation changes?
      description: Auto-commit after implementation
      condition: null
  after_checklist:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit checklist changes?
      description: Auto-commit after checklist generation
      condition: null
  after_analyze:
    - extension: workflow
      command: speckit.workflow.check
      enabled: true
      optional: false
      prompt: Validate Spec Kit references and generated documentation?
      description: Check workflow consistency without writing
      condition: null
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit analysis results?
      description: Auto-commit after analysis
      condition: null
  after_taskstoissues:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit after syncing issues?
      description: Auto-commit after tasks-to-issues conversion
      condition: null
  before_epic:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit outstanding changes before creating an epic?
      description: Auto-commit before epic creation
      condition: null
  after_epic:
    - extension: workflow
      command: speckit.workflow.sync
      enabled: true
      optional: false
      prompt: Synchronize epic documentation?
      description: Refresh the roadmap and epic feature list
      condition: null
  before_adr:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit outstanding changes before creating an ADR?
      description: Auto-commit before ADR creation
      condition: null
  after_adr:
    - extension: workflow
      command: speckit.workflow.sync
      enabled: true
      optional: false
      prompt: Synchronize ADR documentation?
      description: Refresh the ADR index
      condition: null
